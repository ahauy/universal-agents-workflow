[importlinter]
root_packages =
    src

# Enforce Deep Modules: Packages must be accessed via top-level interface (__init__.py / public api),
# internal implementation details (e.g. `_internal/`, `private/`) must not be imported from other packages.
[importlinter:contract:deep-modules-boundary]
name = Deep Modules & Encapsulation Boundary
type = layers
layers =
    src.api
    src.services
    src.domain
    src.infrastructure
ignore_author_layer = false

[importlinter:contract:no-direct-private-imports]
name = Forbid cross-package private imports
type = forbidden
source_modules =
    src
forbidden_modules =
    src.*._internal.*
